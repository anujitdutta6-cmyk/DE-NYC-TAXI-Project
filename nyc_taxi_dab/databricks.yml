# This is a Declarative Automation Bundle definition for nyc_taxi_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyc_taxi_dab
  uuid: 7e9f1501-bc70-477f-91e4-160ce8706628

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: no
      schema: dev
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/anjan.anujit_gmail.com#ext#@anjananujitgmail.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/anjan.anujit_gmail.com#ext#@anjananujitgmail.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: no
      schema: prod
    permissions:
      - user_name: anjan.anujit_gmail.com#ext#@anjananujitgmail.onmicrosoft.com
        level: CAN_MANAGE
